<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cortes IA</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
<main>
  <div class="brand">✂️ CORTES IA</div>

  <h1>Live inteira → Cortes prontos</h1>

  <p class="sub">
    A IA transcreve, encontra os melhores momentos, legenda e transforma em 9:16.
  </p>

  <section class="card">

    <label>Link da live do YouTube</label>
    <input
      id="url"
      type="url"
      placeholder="Cole aqui o link da live..."
    >

    <div class="grid">

      <div>
        <label>Quantidade de cortes</label>
        <select id="count">
          <option value="3">3</option>
          <option value="5" selected>5</option>
          <option value="10">10</option>
        </select>
      </div>

      <div>
        <label>Duração máxima</label>
        <select id="duration">
          <option value="30">30s</option>
          <option value="60" selected>60s</option>
          <option value="90">90s</option>
        </select>
      </div>

    </div>

    <button id="go" type="button">
      🚀 GERAR CORTES COM IA
    </button>

    <div id="status" class="hide">
      <div class="bar">
        <i id="fill"></i>
      </div>

      <b id="msg"></b>
    </div>

    <div id="results"></div>

  </section>

  <small>
    Use somente conteúdo que você tenha autorização para baixar e editar.
  </small>
</main>

<script>
let timer = null;

const urlInput = document.getElementById("url");
const countInput = document.getElementById("count");
const durationInput = document.getElementById("duration");
const goButton = document.getElementById("go");

const statusBox = document.getElementById("status");
const fill = document.getElementById("fill");
const msg = document.getElementById("msg");
const results = document.getElementById("results");


goButton.addEventListener("click", start);


async function start() {

  const url = urlInput.value.trim();
  const count = Number(countInput.value);
  const duration = Number(durationInput.value);

  if (!url) {
    alert("Cole o link da live.");
    return;
  }

  goButton.disabled = true;
  statusBox.classList.remove("hide");
  results.innerHTML = "";

  fill.style.width = "5%";
  msg.textContent = "Iniciando processamento...";

  try {

    const response = await fetch("/api/start", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        url: url,
        count: count,
        duration: duration
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Erro ao iniciar o processamento.");
    }

    if (!data.job_id) {
      throw new Error("O servidor não retornou o ID do processamento.");
    }

    timer = setInterval(() => {
      poll(data.job_id);
    }, 1500);

    await poll(data.job_id);

  } catch (error) {

    console.error(error);

    msg.textContent = error.message;
    goButton.disabled = false;

    if (timer) {
      clearInterval(timer);
      timer = null;
    }
  }
}


async function poll(id) {

  try {

    const response = await fetch("/api/status/" + encodeURIComponent(id));

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Erro ao consultar processamento.");
    }

    const progress = Number(data.progress || 0);

    fill.style.width = Math.max(0, Math.min(100, progress)) + "%";

    msg.textContent = data.message || "Processando...";


    if (data.status === "concluido") {

      if (timer) {
        clearInterval(timer);
        timer = null;
      }

      fill.style.width = "100%";
      msg.textContent = "Cortes prontos!";

      goButton.disabled = false;

      if (Array.isArray(data.clips)) {

        results.innerHTML = data.clips.map((clip, index) => {

          const title = clip.title || ("Corte " + (index + 1));
          const hook = clip.hook || "";
          const file = clip.file || "#";

          return `
            <article>
              <h3>${escapeHtml(title)}</h3>

              <p>${escapeHtml(hook)}</p>

              <a href="${file}" download>
                ⬇️ Baixar corte
              </a>
            </article>
          `;

        }).join("");
      }

      return;
    }


    if (data.status === "erro") {

      if (timer) {
        clearInterval(timer);
        timer = null;
      }

      goButton.disabled = false;

      msg.textContent = data.message || "Ocorreu um erro.";

      return;
    }

  } catch (error) {

    console.error(error);

    if (timer) {
      clearInterval(timer);
      timer = null;
    }

    goButton.disabled = false;

    msg.textContent = error.message || "Erro ao consultar o servidor.";
  }
}


function escapeHtml(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
</script>

</body>
</html>
