<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Cortes IA</title>

  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<main>

  <div class="brand">
    ✂️ CORTES IA
  </div>

  <h1>
    Live inteira → Cortes prontos
  </h1>

  <p class="sub">
    A IA transcreve a live, encontra os melhores momentos
    e transforma tudo em vídeos verticais.
  </p>


  <section class="card">

    <label for="url">
      Link da live do YouTube
    </label>

    <input
      id="url"
      type="url"
      autocomplete="off"
      placeholder="Cole aqui o link da live..."
    >


    <div class="grid">

      <div>

        <label for="count">
          Quantidade de cortes
        </label>

        <select id="count">

          <option value="3">
            3 cortes
          </option>

          <option value="5" selected>
            5 cortes
          </option>

          <option value="10">
            10 cortes
          </option>

        </select>

      </div>


      <div>

        <label for="duration">
          Duração máxima
        </label>

        <select id="duration">

          <option value="30">
            30 segundos
          </option>

          <option value="60" selected>
            60 segundos
          </option>

          <option value="90">
            90 segundos
          </option>

        </select>

      </div>

    </div>


    <button id="go" type="button">
      🚀 GERAR CORTES COM IA
    </button>


    <div
      id="status"
      class="hide"
      aria-live="polite"
    >

      <div class="bar">
        <i id="fill"></i>
      </div>

      <b id="msg">
        Aguardando...
      </b>

    </div>


    <div id="results"></div>

  </section>


  <small>
    Use somente conteúdo que você tenha autorização
    para baixar e editar.
  </small>

</main>


<script>

"use strict";


const urlInput =
  document.getElementById("url");

const countInput =
  document.getElementById("count");

const durationInput =
  document.getElementById("duration");

const goButton =
  document.getElementById("go");

const statusBox =
  document.getElementById("status");

const fill =
  document.getElementById("fill");

const msg =
  document.getElementById("msg");

const results =
  document.getElementById("results");


let timer = null;

let processing = false;


console.log("Cortes IA carregado");


goButton.addEventListener(
  "click",
  start
);


async function start() {

  console.log("Botão clicado");


  if (processing) {
    return;
  }


  const url =
    urlInput.value.trim();


  const clipCount =
    Number(countInput.value);


  const duration =
    Number(durationInput.value);


  if (!url) {

    statusBox.classList.remove("hide");

    msg.textContent =
      "❌ Cole o link da live do YouTube.";

    urlInput.focus();

    return;
  }


  processing = true;

  goButton.disabled = true;


  statusBox.classList.remove("hide");

  results.innerHTML = "";

  fill.style.width = "5%";

  msg.textContent =
    "⏳ Conectando ao servidor...";


  try {

    console.log(
      "Enviando processamento..."
    );


    const response =
      await fetch(
        "/api/start",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            url: url,
            clip_count: clipCount,
            duration: duration
          })
        }
      );


    const text =
      await response.text();


    console.log(
      "Resposta:",
      response.status,
      text
    );


    let data;


    try {

      data =
        JSON.parse(text);
